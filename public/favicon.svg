<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Las Vegas — clinking glasses icon</title>
  <rect width="64" height="64" rx="12" fill="#864347"/>
  <!-- Two tilted martini/cocktail glasses (simple V-cup silhouette — reads
       clearly even at 16px), clinking rim-to-rim at the centre. A bar/
       tavern icon rather than the old dice motif, now that the room itself
       leans into a counter-and-shelf back wall (CLAUDE.md: original,
       code-drawn art, never a copied asset). -->
  <g transform="translate(32,34) rotate(-16)">
    <path d="M-17 -19 L-3 -19 L-10 -4 Z" fill="#f7e6c6" stroke="#dfb979" stroke-width="2" stroke-linejoin="round"/>
    <rect x="-11" y="-5" width="2.4" height="11" fill="#dfb979"/>
    <rect x="-16" y="5.5" width="12" height="2.6" rx="1.3" fill="#dfb979"/>
    <circle cx="-13.5" cy="-13" r="2.6" fill="#7ca472"/>
  </g>
  <g transform="translate(32,34) rotate(16)">
    <path d="M17 -19 L3 -19 L10 -4 Z" fill="#f7e6c6" stroke="#dfb979" stroke-width="2" stroke-linejoin="round"/>
    <rect x="8.6" y="-5" width="2.4" height="11" fill="#dfb979"/>
    <rect x="4" y="5.5" width="12" height="2.6" rx="1.3" fill="#dfb979"/>
    <circle cx="13.5" cy="-13" r="2.6" fill="#7ca472"/>
  </g>
  <!-- A small sparkle where the rims meet, reading as the "clink". -->
  <g fill="#f7e6c6">
    <circle cx="32" cy="-18" r="2" fill="#dfb979"/>
    <circle cx="26" cy="-21" r="1.2"/>
    <circle cx="38" cy="-21" r="1.2"/>
  </g>
</svg>
