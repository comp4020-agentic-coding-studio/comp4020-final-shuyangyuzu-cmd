<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Las Vegas</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=@VERSION@" />
    <!-- The version token below is substituted by src/version.ts at
         request time, from a content hash of app.js+styles.css — this
         is what forces a browser holding an old cached copy to
         actually fetch the new one, which Cache-Control alone can't. -->
    <link rel="stylesheet" href="/styles.css?v=@VERSION@" />
  </head>
  <body>
    <div id="app">Loading…</div>
    <script type="module" src="/app.js?v=@VERSION@"></script>
    <p class="build-version">build @VERSION@</p>
  </body>
</html>
